[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdgen"
version = "0.1.0"
description = "rdgen (record-dependence generalisation): record-dependence as a label-free predictor of accuracy under distribution shift in document-grounded QA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Adjeisah" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "accelerate>=0.33",
  "datasets>=2.20",
]
dev = ["pytest>=8"]

[project.scripts]
rdgen = "rdgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
